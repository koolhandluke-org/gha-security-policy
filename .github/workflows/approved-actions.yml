name: Approved Actions (do not run)

# This workflow never runs. It exists so that Dependabot and Renovate
# can automatically update SHA pins for approved actions.
# The merge-allowlist workflow reads this file and appends new SHAs
# to allowlist.yml.

on: workflow_dispatch

jobs:
  approved:
    if: false
    runs-on: ubuntu-latest
    steps:
      # --- Official GitHub Actions ---
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      - uses: actions/upload-artifact@6027d3ded4b3544a1272a7cd3e5f1d82c1741615 # v4.6.2
      - uses: actions/download-artifact@95815c38ab2b7093691ee1e1b06b6ef6fc33aade # v4.3.0

      # --- Security / CI tooling ---
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4

      # --- JFrog ---
      - uses: jfrog/setup-jfrog-cli@9fe0f98bd45b19e6436f694f67b4e3a2e6d69ea5 # v4.5.6
