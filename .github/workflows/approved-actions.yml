name: Approved Actions (do not run)

# This workflow never runs. It exists so that Dependabot and Renovate
# can automatically update SHA pins for approved actions.
# The merge-allowlist workflow reads this file and appends new SHAs
# to allowlist.yml.

on: workflow_dispatch

jobs:
  approved:
    if: false
    runs-on: ubuntu-latest
    steps:
      # --- Official GitHub Actions ---
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      - uses: actions/download-artifact@95815c38ab2b7093691ee1e1b06b6ef6fc33aade # v4.3.0

      # --- Security / CI tooling ---
      - uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5

      # --- JFrog ---
      - uses: jfrog/setup-jfrog-cli@9fe0f98bd45b19e6436f694f67b4e3a2e6d69ea5 # v4.5.6
