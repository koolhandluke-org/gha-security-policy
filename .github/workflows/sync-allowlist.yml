name: Sync Allowlist to GitHub Org

on:
  push:
    branches: [main]
    paths: [allowlist.yml]

jobs:
  sync:
    name: Update org allowed actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build patterns from allowlist
        id: patterns
        run: |
          # Extract exact owner/repo@sha patterns from allowlist.yml
          patterns=$(yq -r '.actions[] | .name + "@" + .sha' allowlist.yml | jq -R . | jq -sc .)
          echo "json=$patterns" >> "$GITHUB_OUTPUT"

      - name: Update org allowed actions
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          gh api \
            --method PUT \
            "/orgs/${ORG}/actions/permissions/selected-actions" \
            --input - <<EOF
          {
            "github_owned_allowed": true,
            "verified_allowed": false,
            "patterns_allowed": ${{ steps.patterns.outputs.json }}
          }
          EOF
