name: Merge, Audit & Sync Allowlist

on:
  push:
    branches: [main]
    paths: [.github/workflows/approved-actions.yml]
  schedule:
    # Monthly audit + cleanup: 1st of every month at 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: merge-allowlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    name: Merge new SHAs into allowlist
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify SHA-to-tag mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=".github/workflows/approved-actions.yml"
          verification_failed=0

          while IFS='@' read -r name sha; do
            version=$(grep -P "uses:\s+${name}@${sha}" "$source" | grep -oP '#\s*\K\S+' || echo "unknown")
            if [ "$version" = "unknown" ]; then
              echo "::warning::No version comment for ${name}@${sha} — skipping verification"
              continue
            fi

            # Resolve the tag ref via GitHub API
            ref_response=$(gh api "repos/${name}/git/ref/tags/${version}" 2>/dev/null) || {
              echo "::warning::Cannot resolve tag ${version} for ${name} — skipping verification"
              continue
            }

            obj_type=$(echo "$ref_response" | jq -r '.object.type')
            obj_sha=$(echo "$ref_response" | jq -r '.object.sha')

            # Annotated tags need dereferencing (type=tag -> follow to commit)
            if [ "$obj_type" = "tag" ]; then
              obj_sha=$(gh api "repos/${name}/git/tags/${obj_sha}" --jq '.object.sha' 2>/dev/null || echo "")
            fi

            if [ "$obj_sha" != "$sha" ]; then
              echo "::error::SHA mismatch for ${name}@${version}: pinned ${sha}, tag resolves to ${obj_sha}"
              verification_failed=1
            else
              echo "Verified: ${name}@${version} -> ${sha}"
            fi
          done < <(grep -oP 'uses:\s+\K\S+@\S+' "$source")

          if [ "$verification_failed" -eq 1 ]; then
            echo "::error::One or more SHA-to-tag verifications failed"
            exit 1
          fi

      - name: Merge approved-actions into allowlist
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          added=0
          source=".github/workflows/approved-actions.yml"

          while IFS='@' read -r name sha; do
            version=$(grep -P "uses:\s+${name}@${sha}" "$source" | grep -oP '#\s*\K\S+' || echo "unknown")
            existing=$(yq -r ".actions[] | select(.name == \"$name\" and .sha == \"$sha\") | .name" allowlist.yml)

            if [ -z "$existing" ]; then
              echo "Adding $name@$version ($sha)"
              yq -i ".actions += [{\"name\": \"$name\", \"version\": \"$version\", \"sha\": \"$sha\", \"added\": \"$today\"}]" allowlist.yml
              added=$((added + 1))
            else
              echo "Already exists: $name@$sha"
            fi
          done < <(grep -oP 'uses:\s+\K\S+@\S+' "$source")

          echo "### Merge Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Added **$added** new entries to allowlist.yml" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allowlist.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: merge new SHAs into allowlist"
            git push
          fi

  cleanup:
    name: Remove expired entries
    runs-on: ubuntu-latest
    needs: [merge]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.merge.result == 'success')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Remove expired entries
        run: |
          set -euo pipefail
          retention_days=$(yq -r '.retention_days' allowlist.yml)
          cutoff=$(date -u -d "$retention_days days ago" +%Y-%m-%d 2>/dev/null || date -u -v-${retention_days}d +%Y-%m-%d)
          removed=0
          removed_list=""
          source=".github/workflows/approved-actions.yml"

          # Current SHAs are never removed
          current_shas=$(grep -oP 'uses:\s+\S+@\K[a-f0-9]{40}' "$source" || true)

          count=$(yq '.actions | length' allowlist.yml)
          indices_to_remove=""
          for i in $(seq 0 $((count - 1))); do
            added=$(yq -r ".actions[$i].added" allowlist.yml)
            sha=$(yq -r ".actions[$i].sha" allowlist.yml)
            name=$(yq -r ".actions[$i].name" allowlist.yml)
            version=$(yq -r ".actions[$i].version" allowlist.yml)

            if echo "$current_shas" | grep -q "$sha"; then
              continue
            fi

            if [[ "$added" < "$cutoff" ]]; then
              echo "Removing expired: $name@$version (added $added)"
              removed_list="$removed_list\n- $name@$version (added $added)"
              indices_to_remove="$indices_to_remove $i"
              removed=$((removed + 1))
            fi
          done

          # Remove in reverse order to preserve indices
          for i in $(echo "$indices_to_remove" | tr ' ' '\n' | sort -rn); do
            [ -z "$i" ] && continue
            yq -i "del(.actions[$i])" allowlist.yml
          done

          echo "### Cleanup Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Retention period: **$retention_days days** (cutoff: $cutoff)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$removed" -gt 0 ]; then
            echo "Removed **$removed** expired entries:" >> "$GITHUB_STEP_SUMMARY"
            echo -e "$removed_list" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No expired entries found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allowlist.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: remove expired entries from allowlist"
            git push
          fi

  audit:
    name: Audit stale entries
    runs-on: ubuntu-latest
    needs: [cleanup]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.cleanup.result == 'success')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Generate audit report
        run: |
          set -euo pipefail
          source=".github/workflows/approved-actions.yml"
          today=$(date -u +%Y-%m-%d)
          stale_count=0
          major_behind_count=0
          stale_lines=""
          major_lines=""

          # Build map of current versions from approved-actions.yml
          declare -A current_versions
          declare -A current_shas
          while IFS= read -r line; do
            name=$(echo "$line" | grep -oP 'uses:\s+\K[^@]+')
            sha=$(echo "$line" | grep -oP '@\K[a-f0-9]{40}')
            version=$(echo "$line" | grep -oP '#\s*\K\S+' || echo "unknown")
            current_versions["$name"]="$version"
            current_shas["$name"]="$sha"
          done < <(grep -P 'uses:\s+\S+@[a-f0-9]{40}' "$source")

          # Check each allowlist entry
          count=$(yq '.actions | length' allowlist.yml)
          for i in $(seq 0 $((count - 1))); do
            name=$(yq -r ".actions[$i].name" allowlist.yml)
            version=$(yq -r ".actions[$i].version" allowlist.yml)
            sha=$(yq -r ".actions[$i].sha" allowlist.yml)
            added=$(yq -r ".actions[$i].added" allowlist.yml)

            # Skip current version
            if [ "${current_shas[$name]:-}" = "$sha" ]; then
              continue
            fi

            # Calculate age
            added_epoch=$(date -u -d "$added" +%s 2>/dev/null || date -u -j -f "%Y-%m-%d" "$added" +%s)
            today_epoch=$(date -u +%s)
            age_days=$(( (today_epoch - added_epoch) / 86400 ))

            # Compare major versions
            entry_major=$(echo "$version" | grep -oP '^v?\K[0-9]+' || echo "")
            current_version="${current_versions[$name]:-}"
            current_major=$(echo "$current_version" | grep -oP '^v?\K[0-9]+' || echo "")

            stale_count=$((stale_count + 1))
            stale_lines="$stale_lines\n| $name | $version | $current_version | ${age_days}d | $added |"

            # Flag if major version behind
            if [ -n "$entry_major" ] && [ -n "$current_major" ]; then
              major_diff=$((current_major - entry_major))
              if [ "$major_diff" -ge 1 ]; then
                major_behind_count=$((major_behind_count + 1))
                major_lines="$major_lines\n| $name | $version | $current_version | **${major_diff} major** behind | ${age_days}d |"
              fi
            fi
          done

          # Write report
          echo "### Allowlist Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated: $today" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$major_behind_count" -gt 0 ]; then
            echo "#### Major versions behind ($major_behind_count)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Action | Allowed version | Current version | Gap | Age |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|----------------|-----------------|-----|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo -e "$major_lines" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$stale_count" -gt 0 ]; then
            echo "#### All stale entries ($stale_count)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Action | Allowed version | Current version | Age | Added |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|----------------|-----------------|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo -e "$stale_lines" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All allowlist entries are current." >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    name: Sync allowlist to org API
    runs-on: ubuntu-latest
    needs: [audit]
    if: always() && (needs.merge.result == 'success' || needs.audit.result == 'success')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Build patterns from allowlist
        run: |
          set -euo pipefail
          patterns=$(yq -r '.actions[] | .name + "@" + .sha' allowlist.yml | jq -R . | jq -sc .)

          # Write full payload to file to avoid expression injection
          jq -n --argjson patterns "$patterns" '{
            "github_owned_allowed": true,
            "verified_allowed": false,
            "patterns_allowed": $patterns
          }' > /tmp/payload.json

          echo "### Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushing **$(echo "$patterns" | jq '. | length')** patterns to org API" >> "$GITHUB_STEP_SUMMARY"

      - name: Update org allowed actions
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Drift detection: compare current API state with what we're about to push
          current=$(gh api "/orgs/${ORG}/actions/permissions/selected-actions" --jq '.patterns_allowed' 2>/dev/null || echo "[]")
          desired=$(jq -r '.patterns_allowed' /tmp/payload.json)

          # Patterns in API but not in file = manual drift
          drift_out=$(comm -23 \
            <(echo "$current" | jq -r '.[]' | sort) \
            <(echo "$desired" | jq -r '.[]' | sort) || true)
          # Patterns in file but not in API = expected additions
          drift_in=$(comm -13 \
            <(echo "$current" | jq -r '.[]' | sort) \
            <(echo "$desired" | jq -r '.[]' | sort) || true)

          if [ -n "$drift_out" ]; then
            echo "::warning::Manual drift detected — patterns in org API but not in allowlist:"
            echo "$drift_out"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Drift detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Patterns in org API but **not** in allowlist (manual additions):" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$drift_out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$drift_in" ]; then
            echo "New patterns being added to org API:"
            echo "$drift_in"
          fi

          gh api \
            --method PUT \
            "/orgs/${ORG}/actions/permissions/selected-actions" \
            --input /tmp/payload.json

          echo "Org action patterns updated successfully."
