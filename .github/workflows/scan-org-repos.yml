name: Scan Org Repos

on:
  schedule:
    # Weekly scan: Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan org repos for action usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan all org repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          approved=".github/workflows/approved-actions.yml"

          # Build reference files for classification
          grep -oP 'uses:\s+\K\S+@[a-f0-9]{40}' "$approved" > /tmp/current_refs.txt || true
          yq -r '.actions[] | .name + "@" + .sha' allowlist.yml > /tmp/allowed_refs.txt || true

          # Initialize result files
          > /tmp/unknown.txt
          > /tmp/unpinned.txt
          > /tmp/stale.txt
          total_repos=0
          scanned_repos=0

          while read -r repo; do
            total_repos=$((total_repos + 1))

            # List workflow files in the repo
            workflows=$(gh api "repos/${repo}/contents/.github/workflows" \
              --jq '.[].name' 2>/dev/null || echo "")
            if [ -z "$workflows" ]; then
              continue
            fi

            scanned_repos=$((scanned_repos + 1))
            echo "Scanning ${repo} ..."

            while read -r wf; do
              # Only process YAML files
              [[ "$wf" =~ \.(yml|yaml)$ ]] || continue

              # Fetch file content (base64-encoded from Contents API)
              content=$(gh api "repos/${repo}/contents/.github/workflows/${wf}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
              [ -z "$content" ] && continue

              # Extract and classify each uses: reference
              while read -r ref; do
                # Skip local (./) and docker:// references
                [[ "$ref" =~ ^(\./|docker://) ]] && continue

                if [[ ! "$ref" =~ @[a-f0-9]{40}$ ]]; then
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/unpinned.txt
                elif grep -qxF "$ref" /tmp/current_refs.txt; then
                  : # CURRENT — nothing to report
                elif grep -qxF "$ref" /tmp/allowed_refs.txt; then
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/stale.txt
                else
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/unknown.txt
                fi
              done < <(echo "$content" | grep -oP 'uses:\s+\K\S+' || true)
            done <<< "$workflows"
          done < <(gh api --paginate "/orgs/${ORG}/repos" --jq '.[].full_name')

          # Build summary report
          echo "### Org-wide Action Usage Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated: $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanned: **${total_repos}** repos total, **${scanned_repos}** with workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          unknown_count=$(wc -l < /tmp/unknown.txt | tr -d ' ')
          unpinned_count=$(wc -l < /tmp/unpinned.txt | tr -d ' ')
          stale_count=$(wc -l < /tmp/stale.txt | tr -d ' ')

          if [ "$unknown_count" -gt 0 ]; then
            echo "#### UNKNOWN ($unknown_count) — not in allowlist" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/unknown.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$unpinned_count" -gt 0 ]; then
            echo "#### UNPINNED ($unpinned_count) — using tags instead of SHAs" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/unpinned.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$stale_count" -gt 0 ]; then
            echo "#### STALE ($stale_count) — in allowlist but not current version" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stale.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$unknown_count" -eq 0 ] && [ "$unpinned_count" -eq 0 ] && [ "$stale_count" -eq 0 ]; then
            echo "All repos are using current, pinned, allowed actions." >> "$GITHUB_STEP_SUMMARY"
          fi
