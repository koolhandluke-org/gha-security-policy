name: Scan Org Repos

on:
  schedule:
    # Weekly scan: Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan org repos for action usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan all org repos
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          approved=".github/workflows/approved-actions.yml"

          # Build reference files for classification
          grep -oP 'uses:\s+\K\S+@[a-f0-9]{40}' "$approved" > /tmp/current_refs.txt || true
          yq -r '.actions[] | .name + "@" + .sha' allowlist.yml > /tmp/allowed_refs.txt || true

          # Read policy config from allowlist.yml
          retention_days=$(yq -r '.retention_days' allowlist.yml)
          expiry_warning_days=$(yq -r '.expiry_warning_days // 30' allowlist.yml)

          # Build expiring refs — entries within expiry_warning_days of retention cutoff
          warning_days=$((retention_days - expiry_warning_days))
          warning_cutoff=$(date -u -d "${warning_days} days ago" +%Y-%m-%d 2>/dev/null || date -u -v-${warning_days}d +%Y-%m-%d)
          > /tmp/expiring_refs.txt
          count=$(yq '.actions | length' allowlist.yml)
          for i in $(seq 0 $((count - 1))); do
            added=$(yq -r ".actions[$i].added" allowlist.yml)
            sha=$(yq -r ".actions[$i].sha" allowlist.yml)
            name=$(yq -r ".actions[$i].name" allowlist.yml)
            # Skip current SHAs (they're never removed)
            if grep -qF "$sha" /tmp/current_refs.txt; then
              continue
            fi
            if [[ "$added" < "$warning_cutoff" ]]; then
              echo "${name}@${sha}" >> /tmp/expiring_refs.txt
            fi
          done

          # Initialize result files
          > /tmp/unknown.txt
          > /tmp/stale.txt
          > /tmp/expiring.txt
          total_repos=0
          scanned_repos=0

          while read -r repo; do
            total_repos=$((total_repos + 1))

            # List workflow files in the repo
            workflows=$(gh api "repos/${repo}/contents/.github/workflows" \
              --jq '.[].name' 2>/dev/null || echo "")
            if [ -z "$workflows" ]; then
              continue
            fi

            scanned_repos=$((scanned_repos + 1))
            echo "Scanning ${repo} ..."

            while read -r wf; do
              # Only process YAML files
              [[ "$wf" =~ \.(yml|yaml)$ ]] || continue

              # Fetch file content (base64-encoded from Contents API)
              content=$(gh api "repos/${repo}/contents/.github/workflows/${wf}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
              [ -z "$content" ] && continue

              # Extract and classify each uses: reference
              while read -r ref; do
                # Skip local (./) and docker:// references
                [[ "$ref" =~ ^(\./|docker://) ]] && continue

                # Skip refs without a SHA pin (tags won't be allowed anyway)
                [[ "$ref" =~ @[a-f0-9]{40}$ ]] || continue

                if grep -qxF "$ref" /tmp/current_refs.txt; then
                  : # CURRENT — nothing to report
                elif grep -qxF "$ref" /tmp/expiring_refs.txt; then
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/expiring.txt
                elif grep -qxF "$ref" /tmp/allowed_refs.txt; then
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/stale.txt
                else
                  echo "| ${repo} | ${wf} | \`${ref}\` |" >> /tmp/unknown.txt
                fi
              done < <(echo "$content" | grep -oP 'uses:\s+\K\S+' || true)
            done <<< "$workflows"
          done < <(gh api --paginate "/orgs/${ORG}/repos" --jq '.[].full_name')

          # Build summary report
          echo "### Org-wide Action Usage Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated: $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanned: **${total_repos}** repos total, **${scanned_repos}** with workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          unknown_count=$(wc -l < /tmp/unknown.txt | tr -d ' ')
          stale_count=$(wc -l < /tmp/stale.txt | tr -d ' ')
          expiring_count=$(wc -l < /tmp/expiring.txt | tr -d ' ')

          if [ "$expiring_count" -gt 0 ]; then
            echo "#### EXPIRING ($expiring_count) — repos using SHAs about to be removed from allowlist" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "These entries are within ${expiry_warning_days} days of the ${retention_days}-day retention cutoff." >> "$GITHUB_STEP_SUMMARY"
            echo "Repos must update or their actions will become UNKNOWN after cleanup." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/expiring.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$unknown_count" -gt 0 ]; then
            echo "#### UNKNOWN ($unknown_count) — not in allowlist" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/unknown.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$stale_count" -gt 0 ]; then
            echo "#### STALE ($stale_count) — in allowlist but not current version" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repo | Workflow | Action |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/stale.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$unknown_count" -eq 0 ] && [ "$stale_count" -eq 0 ] && [ "$expiring_count" -eq 0 ]; then
            echo "All repos are using current, pinned, allowed actions." >> "$GITHUB_STEP_SUMMARY"
          fi
