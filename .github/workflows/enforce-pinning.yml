name: Enforce Action Pinning

on:
  workflow_call:

jobs:
  check-pinning:
    name: Check SHA pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure actions are pinned to SHAs
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4
        with:
          # Allow local composite actions (e.g. ./my-action)
          allowlist: |
            ./
